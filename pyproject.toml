[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shacl-github-study"
version = "0.1.0"
description = "Discovery of public GitHub repositories that may contain SHACL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "rdflib>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shacl_study = ["data/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
